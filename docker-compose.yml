services:
  workbench:
    image: ghcr.io/wwenxiong/workbench:latest
    container_name: workbench
    restart: unless-stopped
    ports:
      - "3001:3001" # 飞牛NAS外部访问端口:容器内部端口。若80/443不可用，可修改为例如 "8080:3001" 或 "28080:3001"
    volumes:
      - ./data:/app/server/data # 挂载本地目录，持久化保存 SQLite 数据库
      - ./uploads:/app/server/uploads # 挂载本地目录，持久化保存上传的文件与头像
    environment:
      - PORT=3001
      - NODE_ENV=production
